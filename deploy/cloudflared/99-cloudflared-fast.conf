# 99-cloudflared-fast.conf
# Linux 内核网络栈与文件描述符调优，确保 cloudflared 运行 QUIC 协议时高吞吐不丢包。
#
# 安装：
#   sudo install -m 0644 deploy/cloudflared/99-cloudflared-fast.conf /etc/sysctl.d/99-cloudflared-fast.conf
#   sudo sysctl --system

# 增大 UDP 接收与发送缓冲区，确保 QUIC 协议高吞吐不丢包
net.core.rmem_max=2500000
net.core.wmem_max=2500000
net.core.rmem_default=2500000
net.core.wmem_default=2500000

# 优化本地回环/Unix Socket 的连接队列
net.core.somaxconn=4096

# 开启 TCP BBR 拥塞控制（若隧道降级至 TCP 443 时生效）
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
